name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    # No workflow runs in a private repository.
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows failures are known and tracked (EllissoideRotondo/Allspice.jl#15).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - version: '1.10'
            os: macos-latest
          - version: '1.10'
            os: windows-latest
    env:
      JULIA_NUM_THREADS: 4
      ALLSPICE_REQUIRE_KERNELS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Cache the test kernels
        uses: actions/cache@v4
        with:
          path: test/data
          key: kernels-${{ hashFiles('test/kernels.jl') }}
          # A cache of an older kernel list restores the files it has; the
          # download script fetches only the missing ones.
          restore-keys: kernels-
          # One archive serves every runner, so Windows does not download.
          enableCrossOsArchive: true
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
